<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>韩俊宇的书库 · 全球书榜</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- 液态玻璃背景光斑 -->
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>
<div class="orb orb-d"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 6.2C10.6 4.9 8.6 4.2 6.2 4.2c-1.6 0-3.1.3-4.2.8v13.4c1.1-.5 2.6-.8 4.2-.8 2.4 0 4.4.7 5.8 2 1.4-1.3 3.4-2 5.8-2 1.6 0 3.1.3 4.2.8V5c-1.1-.5-2.6-.8-4.2-.8-2.4 0-4.4.7-5.8 2z" fill="#fff" opacity="0.96"/>
        <path d="M12 6.2v13.4" stroke="#6c5ce7" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>韩俊宇的书库</h1>
      <p class="tagline">不知道看什么?来这里挑一本</p>
    </div>
  </div>
  <nav class="tabs" aria-label="主导航">
    <button class="tab active" data-page="trending">今日热榜</button>
    <button class="tab" data-page="library">书库</button>
    <button class="tab" data-page="pick">帮我选书</button>
    <button class="tab" data-page="favorites">我的收藏</button>
  </nav>
  <button id="themeToggle" class="theme-btn" title="切换深色 / 浅色">🌙</button>
</header>

<main id="content" class="content"></main>

<footer class="footer">
  <div class="footer-brand">韩俊宇的书库 <span class="footer-heart">♥</span> 全球书榜</div>
  <div class="footer-line"></div>
  数据来源:Open Library(openlibrary.org,免费开放数据)· 榜单为全球热门趋势<br>
  书名、简介与主题标签自动翻译 · 缓存与收藏仅保存在本机
</footer>

<!-- 书籍详情弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="modal-close" title="关闭(Esc)">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
