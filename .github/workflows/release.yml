# BookPicks Release
# Triggered by a push of a v* tag or manually. Builds Windows + Android,
# signs the Android APK with the keystore from GitHub Secrets, writes
# SHA256SUMS.txt and creates a DRAFT release (never publishes directly).
#
# Required repository secrets:
#   BOOKPICKS_KEYSTORE_BASE64  base64 of the release .keystore
#   BOOKPICKS_KEY_ALIAS        key alias
#   BOOKPICKS_STORE_PASSWORD   keystore password
#   BOOKPICKS_KEY_PASSWORD     key password
#
# The keystore is decoded to a temp file, used only by the build, and
# removed afterwards. No password / token / keystore content is logged.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & create draft release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (build-tools 36.1.0 / android-36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.1.0 platforms;android-36 platform-tools'

      - name: JS syntax check
        shell: pwsh
        run: |
          node --check www/app.js
          node --check android/assets/www/app.js

      - name: Build Windows (publish\BookPicks.exe)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath BookPicks-windows.zip -Force
          Write-Host "ZIP: $((Get-Item BookPicks-windows.zip).Length) bytes"

      - name: Decode keystore to temp
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.BOOKPICKS_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw 'Secret BOOKPICKS_KEYSTORE_BASE64 is not set' }
          $bytes = [System.Convert]::FromBase64String($env:KEYSTORE_B64)
          [System.IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'bookpicks.keystore'), $bytes)

      - name: Build signed Android APK
        shell: pwsh
        env:
          BOOKPICKS_KEYSTORE: ${{ runner.temp }}\bookpicks.keystore
          BOOKPICKS_KEY_ALIAS: ${{ secrets.BOOKPICKS_KEY_ALIAS }}
          BOOKPICKS_STORE_PASSWORD: ${{ secrets.BOOKPICKS_STORE_PASSWORD }}
          BOOKPICKS_KEY_PASSWORD: ${{ secrets.BOOKPICKS_KEY_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File android\build-android.ps1 -Signed

      - name: Remove temp keystore
        shell: pwsh
        if: always()
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'bookpicks.keystore'
          if (Test-Path $ks) { Remove-Item $ks -Force }
          Write-Host 'temp keystore removed'

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash BookPicks-windows.zip -Algorithm SHA256).Hash
          $apkHash = (Get-FileHash android\BookPicks.apk -Algorithm SHA256).Hash
          "$zipHash  BookPicks-windows.zip" | Set-Content SHA256SUMS.txt
          "$apkHash  BookPicks.apk" | Add-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Verify APK is signed
        shell: pwsh
        run: |
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools\36.1.0\apksigner.bat'
          $tmp = Join-Path $env:RUNNER_TEMP 'release.apk'
          Copy-Item android\BookPicks.apk $tmp -Force
          & cmd /c "`"$apksigner`" verify `"$tmp`""
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          Write-Host 'APK signature verified'

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            BookPicks-windows.zip
            android/BookPicks.apk
            SHA256SUMS.txt
